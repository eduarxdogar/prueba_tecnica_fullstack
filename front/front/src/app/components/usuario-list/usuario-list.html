<div class="list-container">
  <mat-card>
    <mat-card-title>
      Lista de Usuarios
    </mat-card-title>
    
    <mat-card-content>
      <div class="add-button-container">
        <button mat-raised-button color="primary" routerLink="/crear-usuario">
          <mat-icon>add</mat-icon>
          <span class="add-button-text">Añadir Nuevo Usuario</span> 
        </button>
      </div>

      <div class="table-responsive-wrapper"> <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
          
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> ID </th>
            <td mat-cell *matCellDef="let user"> {{user.id}} </td>
          </ng-container>

          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let user"> {{user.nombre}} </td>
          </ng-container>

          <ng-container matColumnDef="correo">
            <th mat-header-cell *matHeaderCellDef> Correo </th>
            <td mat-cell *matCellDef="let user"> {{user.correo}} </td>
          </ng-container>

          <ng-container matColumnDef="edad">
            <th mat-header-cell *matHeaderCellDef> Edad </th>
            <td mat-cell *matCellDef="let user"> {{user.edad}} </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let user">
              <button mat-icon-button color="primary" (click)="editarUsuario(user.id!)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="eliminarUsuario(user.id!)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

      <div class="mobile-card-list">
        <mat-card *ngFor="let user of dataSource" class="mobile-user-card">
          
          <mat-card-header>
            <mat-icon mat-card-avatar>account_circle</mat-icon>
            <mat-card-title>{{ user.nombre }}</mat-card-title>
            <mat-card-subtitle>{{ user.correo }}</mat-card-subtitle>
          </mat-card-header>
          
          <mat-card-content>
            <p><strong>ID:</strong> {{ user.id }}</p>
            <p><strong>Edad:</strong> {{ user.edad }}</p>
          </mat-card-content>
          
          <mat-card-actions align="end"> <button mat-button color="primary" (click)="editarUsuario(user.id!)">
              <mat-icon>edit</mat-icon>
              Editar
            </button>
            <button mat-button color="warn" (click)="eliminarUsuario(user.id!)">
              <mat-icon>delete</mat-icon>
              Eliminar
            </button>
          </mat-card-actions>
          
        </mat-card>
      </div>

    </mat-card-content>
  </mat-card>
</div>
