<div class="form-container">
  <mat-card>
    <mat-card-title>
      {{ editMode ? 'Editar Usuario' : 'Crear Nuevo Usuario' }}
    </mat-card-title>
    
    <mat-card-content>
      <form [formGroup]="usuarioForm" (ngSubmit)="onSubmit()">
        
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre" placeholder="Ej. Juan Pérez">
          <mat-error *ngIf="usuarioForm.get('nombre')?.hasError('required')">
            El nombre es requerido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Correo</mat-label>
          <input matInput type="email" formControlName="correo" placeholder="Ej. juan@correo.com">
          <mat-error *ngIf="usuarioForm.get('correo')?.hasError('required')">
            El correo es requerido
          </mat-error>
          <mat-error *ngIf="usuarioForm.get('correo')?.hasError('email')">
            Formato de correo inválido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Edad</mat-label>
          <input matInput type="number" formControlName="edad">
           <mat-error *ngIf="usuarioForm.get('edad')?.hasError('required')">
            La edad es requerida
          </mat-error>
           <mat-error *ngIf="usuarioForm.get('edad')?.hasError('min')">
            Debe ser mayor de 18 años
          </mat-error>
        </mat-form-field>

        <div class="button-row">
          <button mat-raised-button color="primary" type="submit" [disabled]="usuarioForm.invalid">
            {{ editMode ? 'Actualizar' : 'Guardar' }}
          </button>
          <a mat-button href="/usuarios">
            Cancelar
          </a>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
